services:
  mongodb:
    image: mongo:7
    container_name: musify-mongodb
    ports:
      - "27017:27017"
    volumes:
      - musify-mongo-data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musify-backend
    ports:
      - "3001:3001"
    volumes:
      - musify-uploads:/app/uploads
    environment:
      PORT: 3001
      API_URL: http://localhost:3001/api
      MONGODB_URI: mongodb://mongodb:27017/musify
      JWT_SECRET: musify-jwt-secret-key-2024
      JWT_REFRESH_SECRET: musify-refresh-secret-key-2024
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    container_name: musify-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  musify-mongo-data:
  musify-uploads:
